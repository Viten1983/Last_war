        const group = svgNode("g", { class: `cell${reachable ? " reachable" : ""}`, tabindex: args.readonly ? -1 : 0, role: args.readonly ? "img" : "button" });
        const style = cellStyle(terrain, resource);
        if (withImage) {
          // Case invisible mais cliquable : le décor vient de l'image.
          group.appendChild(svgNode("polygon", { class: "ground", points: hexPoints(x, y), fill: "rgba(255,255,255,0)", stroke: "none" }));
        } else {
          group.appendChild(svgNode("polygon", { class: "ground", points: hexPoints(x, y), fill: style.fill, stroke: style.stroke, "stroke-width": style.width }));
          drawTerrainArt(group, q, r, x, y, terrain, resource);
        }
// 1. Déplacement ou placement : remplissage.  
if (reachable || placed) {  
  group.appendChild(svgNode("polygon", {  
    class: "highlight",  
    points: hexPoints(x, y),  
    fill: placed ? "#facc15" : "#22c55e",  
    "fill-opacity": 0.30,  
    stroke: placed ? "#a16207" : "#15803d",  
    "stroke-width": 3  
  }));  
}  
  
  // 2. Portée : contour intérieur orange, sans remplissage.  
  // Une case peut être à la fois verte et entourée d'orange.  
  if (inAttackRange) {  
    group.appendChild(svgNode("polygon", {  
      class: "highlight",  
      points: hexPoints(x, y, SIZE - 7),  
      fill: "none",  
      stroke: "#ea580c",  
      "stroke-width": 3,  
      "stroke-dasharray": "6 4",  
      "stroke-linejoin": "round"  
    }));  
  }  
    
  // 3. Véritable cible attaquable : contour rouge prioritaire.  
  if (target) {  
    group.appendChild(svgNode("polygon", {  
      class: "highlight",  
      points: hexPoints(x, y, SIZE - 3),  
      fill: "#ef4444",  
      "fill-opacity": 0.16,  
      stroke: "#b91c1c",  
      "stroke-width": 5,  
      "stroke-linejoin": "round"  
    }));  
  }  
        // Sur l'image, la coordonnée n'apparaît qu'au survol (voir CSS).
        drawCoord(group, x, y - 31, coord(q, r), withImage || Boolean(resource && resource[0] === "mana") || terrain === "forest" || terrain === "sea");
        if (piece) {
          // Chaque pièce dans son propre groupe : il peut être animé.
          const pieceGroup = svgNode("g", { class: "piece-layer", "pointer-events": "none" });
          drawPiece(pieceGroup, piece, x, y);
          group.appendChild(pieceGroup);
          pieceGroups[piece.id] = pieceGroup;
          if (hiddenPieces.has(piece.id)) pieceGroup.setAttribute("opacity", "0");
          drawAiMark(group, piece, x, y);
        }
        // Marqueurs de récolte des héros vagabonds (dernière ressource traversée).
        const heroMarks = markers.get(cellKey);
        if (heroMarks) {
          heroMarks.forEach((mark, index) => {
            const mx = x - 24 + index * 13, my = y + 22;
            group.appendChild(svgNode("polygon", { class: "token", points: `${mx},${my - 7} ${mx + 6},${my} ${mx},${my + 7} ${mx - 6},${my}`, fill: "#f5f5f4", stroke: "#1c1917", "stroke-width": 1.5 }));
            addText(group, mx, my + 0.5, mark, 7, "#1c1917");
          });
        }
        // Sur l'image, l'or et le mana sont déjà dessinés.
        if (resource && !withImage) drawResourceCount(group, x, y, resource);
        group.addEventListener("click", () => emitCellClick(q, r));
        group.addEventListener("keydown", event => { if (event.key === "Enter" || event.key === " ") { event.preventDefault(); emitCellClick(q, r); } });
       group.addEventListener("mouseenter", () => {  
  const details = [coord(q, r), style.name];

  if (resource) {
    details.push(
      `${resource[0] === "gold" ? "Or" : "Mana"} x${resource[1]}`
    );
  }
  if (piece) {
    details.push(piece.name);
  }
  
  if (reachable) {  
    if (piece || args.attack_zone !== undefined) {  
      const cost = destinations[cellKey];  
  
      details.push(  
        cost > 0  
          ? `Déplacement : ${cost} point(s)`  
          : "Placement possible"  
      );  
    }  
  }  
  
  if (inAttackRange) {  
    details.push("Dans la portée d’attaque");  
  }  
  
  if (target) {  
    details.push(  
      targets[cellKey].spell  
        ? "Cible de sort possible"  
        : "Cible attaquable"  
    );  
  }  
  
  info.textContent = details.join(" — ");  
});
        group.addEventListener("mouseleave", () => { info.textContent = "Clique sur une case ou une pièce."; });
        board.appendChild(group);
      }
      const startCenter = center(0, 16); // A17
      const endCenter = center(24, -12); // Y1
      // L'image contient déjà sa propre ligne en pointillés.
      if (!withImage) board.appendChild(svgNode("line", {
        x1: startCenter.x,
        y1: startCenter.y,
        x2: endCenter.x,
        y2: endCenter.y,
        stroke: "#000000",
        "stroke-width": 4,
        "stroke-dasharray": "10 8",
        "stroke-linecap": "round",
        "pointer-events": "none",
      }));
      drawFxMarks();
      // Calque des animations : conservé d'un rendu à l'autre (une animation
      // en cours continue même si Streamlit redessine le plateau).
      board.appendChild(fxLayer);
      animateLastMove();
      queueFx();
      wrapper.scrollLeft = previousScrollLeft;
      wrapper.scrollTop = previousScrollTop;
      requestAnimationFrame(resizeFrame);
    }

    window.addEventListener("message", event => {
      if (event.source !== window.parent) return;
      const message = event.data;
      if (message && message.type === "streamlit:render" && message.args) render(message.args);
    });
    window.addEventListener("resize", resizeFrame);
    if ("ResizeObserver" in window) new ResizeObserver(resizeFrame).observe(wrapper);
    sendToStreamlit("streamlit:componentReady", { apiVersion: 1 });
    resizeFrame();
  </script>
</body>
</html>
